name: CI build
on:
  workflow_run:
    workflows: ["CI"]
    types: ["completed"]
    branches: [master]
jobs:
  on-success:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # One release run at a time, never cancelled halfway. Overlapping runs compute the same version: the one whose push
    # is rejected makes release-it delete the other's tag from origin, and both may try to publish it. A newer pending
    # run can replace an older pending one; nothing is lost because every run releases all of master.
    concurrency:
      group: ci-build-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Set up Git commit author
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      # Exits 0 when there are no commits since the last tag (requireCommitsFail: false). Any other failure, such as a
      # rejected push, stops the job here, before a version that never reached master can be published.
      - name: Run release-it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release -- --ci
      # Asks the registry instead of comparing package.json before and after release-it, so re-running a release whose
      # npm publish failed still publishes it while master is still at that release's tag. If a newer release runs
      # first, it releases and publishes the next version and the failed one stays off npm. Fails the job if the
      # registry cannot be read.
      - name: Check if this version is on npm
        id: registry
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          VERSIONS=$(npm view "$NAME" versions --json)
          PUBLISHED=$(node -p '[].concat(JSON.parse(process.argv[1])).includes(process.argv[2])' "$VERSIONS" "$VERSION")
          echo "$NAME@$VERSION already on npm: $PUBLISHED"
          echo "published=$PUBLISHED" >> $GITHUB_OUTPUT
      # npm can list a new version a little after its publish, so a run that starts right after another run's publish
      # may read an old listing and publish the same version again, which npm rejects. A failed publish (that one, or a
      # timeout after the upload went through) therefore counts as done once npm lists the version.
      - name: Publish to npm
        if: steps.registry.outputs.published == 'false'
        run: |
          npx --yes npm@latest publish --access public --provenance && exit 0
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          for DELAY in 10 20 30 60; do
            sleep "$DELAY"
            VERSIONS=$(npm view "$NAME" versions --json) || continue
            LISTED=$(node -p '[].concat(JSON.parse(process.argv[1])).includes(process.argv[2])' \
              "$VERSIONS" "$VERSION") || continue
            if [ "$LISTED" = true ]; then
              echo "npm publish failed, but npm lists $NAME@$VERSION, so it is published"
              exit 0
            fi
          done
          echo "npm publish failed and npm does not list $NAME@$VERSION"
          exit 1
