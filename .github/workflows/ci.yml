name: CI
on:
  push:
    paths: ['package.json', 'package-lock.json', 'tsconfig.json', 'src/**', 'test/**', '.github/**']
  pull_request:
    paths: ['package.json', 'package-lock.json', 'tsconfig.json', 'src/**', 'test/**', '.github/**']
  # Lets a release be started by hand (Actions > CI > Run workflow on master): a push that touches none of the
  # paths above, such as a README-only change, runs no CI and therefore no release.
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
